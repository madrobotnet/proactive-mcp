[project]
name = "proactive-mcp"
version = "0.1.0"
description = "A proactive layer for every AI agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.0,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "keyring>=25,<26",
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
    "tzlocal>=5.0,<6.0",
]

[project.scripts]
proactive-mcp = "proactive_mcp.cli:entrypoint"

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proactive_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",
    "D",
    "PLR2004",
    "S101",
    "S603",
    "SLF001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
stubPath = "typings"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
